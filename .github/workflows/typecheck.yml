name: Type check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  just-check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install just
        run: brew install just
      - run: just check
